[project]
name = "gitray"
version = "0.1.0"
description = "Scan GitHub repositories for malicious patterns without cloning or executing them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = [
    "network: test talks to the real GitHub API (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, seeded (non-crypto) random data and harmless fake samples.
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "RUF001"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src"]
